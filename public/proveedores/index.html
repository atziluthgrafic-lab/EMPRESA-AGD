<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Oficina Virtual de Talleres & Proveedores — Atziluth Gráfic Digital</title>
  <link rel="icon" href="/favicon_atziluth.jpg" type="image/jpeg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    if (typeof lucide === "undefined") {
      document.write("<script src=\"https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js\"><\/script>");
    }
  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  
  <script>
    // Automatic Seamless Redirection to React Provider Virtual Office
    (function() {
      const currentSearch = window.location.search || '';
      // Forward any token or provider parameter straight to the SPA provider workspace
      window.location.replace('/' + currentSearch + '#proveedor');
    })();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
  <div class="max-w-md w-full bg-slate-900 border-2 border-amber-500/40 rounded-3xl p-8 text-center space-y-6 shadow-2xl">
    <div class="w-16 h-16 bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl flex items-center justify-center text-slate-950 font-black mx-auto shadow-lg shadow-amber-500/30">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-1-1l-3 3m2 8l-3-3m0 0l-4 4-2-2-4 4 2 2 4-4 2 2 4-4z"/>
        <circle cx="7.5" cy="15.5" r="5.5"/>
      </svg>
    </div>
    
    <div class="space-y-2">
      <h1 class="text-xl font-bold font-mono text-white">Oficina Virtual de Talleres</h1>
      <p class="text-xs text-slate-400">
        Iniciando entorno seguro de producción de Atziluth Gráfic Digital...
      </p>
    </div>

    <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
      <div class="flex items-center justify-center gap-2 text-amber-400 text-xs font-mono font-bold">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
        <span>Redirigiendo a tu panel...</span>
      </div>
      <a href="/#proveedor" class="inline-block px-5 py-2.5 bg-amber-500 text-slate-950 font-mono text-xs font-bold rounded-xl shadow hover:bg-amber-400 transition-all">
        Clic aquí si no redirige automáticamente
      </a>
    </div>
  </div>
</body>
</html>
